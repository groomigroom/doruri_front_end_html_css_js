<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10CM 일말의 가능성 이벤트</title>
    <link rel="stylesheet" href="../../group-main/triples/css/TriplesMain.css">
    <link rel="stylesheet" href="../triples/css/TriplesEvent.css">
    <style>
        .tri_e_last_win_part {
            display: none;
        }


        .TenCM_e_last_input_part {
            width: 100vw;
            height: 380px;
            position: relative;
        }

        .TenCM_e_last_input {
            position: absolute;
            width: 150px;
            height: 30px;
            border: 5px solid #191919;
            background-color: #fcfcfc;
            border-radius: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .TenCM_e_last_input_part > .TenCM_e_last_input:nth-of-type(1) {
            top: 0px;
        }

        .TenCM_e_last_input_part > .TenCM_e_last_input:nth-of-type(2) {
            top: 65px;
        }

        .TenCM_e_last_input_part > .TenCM_e_last_input:nth-of-type(3) {
            top: 130px;
        }

        .TenCM_e_last_input_part > .TenCM_e_last_input:nth-of-type(4) {
            top: 195px;
        }

        .TenCM_e_last_input_part > .TenCM_e_last_input:nth-of-type(5) {
            top: 260px;
        }

        .TenCM_e_last_input_part > p {
            width: 100vw;
            text-align: center;
            font-size: 15px;
            line-height: 15px;
            font-weight: 500;
            position: absolute;
        }

        .TenCM_e_last_input_part > p:nth-of-type(1) {
            top: 40px;
        }

        .TenCM_e_last_input_part > p:nth-of-type(2) {
            top: 105px;
        }

        .TenCM_e_last_input_part > p:nth-of-type(3) {
            top: 170px;
        }

        .TenCM_e_last_input_part > p:nth-of-type(4) {
            top: 235px;
        }

        .TenCM_e_last_input_part > p:nth-of-type(5) {
            top: 300px;
        }

        .TenCM_e_last_input_part > p:nth-of-type(6) {
            top: 325px;
        }

        .TenCM_e_p_win_present_img {
            border: 5px solid #000000;
        }
    </style>
</head>

<body>
<div className="TenCMEvent_full">
    <header class="tri_m_header">
        <Menu/>
        <section class="home_translate">
            <a href='/TenCMEvent' class="on">한국어</a>
            <a href='/TenCMEventEng'>English</a>
        </section>
    </header>
    <section class="tri_e_logo">
        <img src="./img/10CM_e_m_logo.png" alt="10CM 이벤트 로고"/>
    </section>
    <section class="tri_m_h2">
        <h2><img src="../../imgs/main_h2_deco.png" alt="10CM">숫자 입력 이벤트
            <img src="../../imgs/main_h2_deco.png"
                 alt="10CM"></h2>
    </section>
    <section class='tri_m_intropp'>
        <p>
            1부터 5까지의<br/>
            숫자를 1번씩 사용해서<br/>
            10을 만들어 주세요!
        </p>
    </section>
    <section class="TenCM_e_last_input_part">
        <!-- 5 -->
        <input class="TenCM_e_last_input" type="text" name="Tencm_e_number_input1" autocomplete="off">
        <p>x</p>
        <!-- 2 -->
        <input class="TenCM_e_last_input" type="text" name="Tencm_e_number_input2" autocomplete="off">
        <p>+</p>
        <!-- 4 -->
        <input class="TenCM_e_last_input" type="text" name="Tencm_e_number_input3" autocomplete="off">
        <p>-</p>
        <!-- 1 -->
        <input class="TenCM_e_last_input" type="text" name="Tencm_e_number_input4" autocomplete="off">
        <p>-</p>
        <!-- 3 -->
        <input class="TenCM_e_last_input" type="text" name="Tencm_e_number_input5" autocomplete="off">
        <p>= 10</p>
        <p class="tencm_e_last_result">최종 결과 : </p>
    </section>
    <FooterPart100vh FooterPartText='ⓒ 씨에이엠위더스'/>
    <!--popup-->
    <section class="tri_e_last_win_part">
        <section class="tri_e_p_win_intropp">
            <p>
                당첨을 축하드려요!<br/>
                상품은 연필 세트입니다.<br/>
                이벤트에 관심가져 주셔서 감사합니다.<br/>
                이 이벤트는 가상의 이벤트입니다.<br/>
                참고해 주시길 부탁드리겠습니다.<br/>
            </p>
        </section>
        <section class="tri_e_p_win_present_150">
            <img src="./img/TenCM_e_pencil_set_illust.png" alt="연필 세트" class="TenCM_e_p_win_present_img"/>
        </section>
    </section>
</div>
<script>
    const Tencm_e_number_input1 = document.querySelector("input[name = \"Tencm_e_number_input1\"]");
    const Tencm_e_number_input2 = document.querySelector("input[name = \"Tencm_e_number_input2\"]");
    const Tencm_e_number_input3 = document.querySelector("input[name = \"Tencm_e_number_input3\"]");
    const Tencm_e_number_input4 = document.querySelector("input[name = \"Tencm_e_number_input4\"]");
    const Tencm_e_number_input5 = document.querySelector("input[name = \"Tencm_e_number_input5\"]");
    const tri_e_last_win_part = document.querySelector(".tri_e_last_win_part");
    const tencm_e_last_result = document.querySelector(".tencm_e_last_result");

    function tencm_e_checkvalues() {
        const values = [
            Tencm_e_number_input1.value,
            Tencm_e_number_input2.value,
            Tencm_e_number_input3.value,
            Tencm_e_number_input4.value,
            Tencm_e_number_input5.value
        ];

        // 하나라도 비어 있으면 계산하지 않음
        if (values.some(value => value === "")) {
            tencm_e_last_result.textContent = "최종 결과: ";
            return;
        }

        const n1 = Number(Tencm_e_number_input1.value);
        const n2 = Number(Tencm_e_number_input2.value);
        const n3 = Number(Tencm_e_number_input3.value);
        const n4 = Number(Tencm_e_number_input4.value);
        const n5 = Number(Tencm_e_number_input5.value);

        const acting_number_of_all = n1 * n2 + n3 - n4 - n5;

        console.log(acting_number_of_all);

        tencm_e_last_result.textContent =
            "최종 결과: " + acting_number_of_all;

        if (acting_number_of_all === 10) {
            console.log(10);
            tri_e_last_win_part.style.display = "block";
        }
    }

    Tencm_e_number_input1.addEventListener("input", tencm_e_checkvalues);
    Tencm_e_number_input2.addEventListener("input", tencm_e_checkvalues);
    Tencm_e_number_input3.addEventListener("input", tencm_e_checkvalues);
    Tencm_e_number_input4.addEventListener("input", tencm_e_checkvalues);
    Tencm_e_number_input5.addEventListener("input", tencm_e_checkvalues);
</script>
</body>

</html>
