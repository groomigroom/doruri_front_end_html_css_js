    <style>
        .tri_e_last_win_part {
            display: none;
        }

        .yena_e_moving_part {
            width: calc(100% - 80px);
            height: 440px;
            position: relative;
            margin: 0 auto;
        }

        .yena_e_me_part {
            position: absolute;
            z-index: 2;
            animation: yena_e_me_part 8s ease 0s infinite;
        }

        @keyframes yena_e_me_part {
            0% {
                top: 30px;
                left: 30px;
            }

            12.5% {
                top: 30px;
                left: 30px;
            }

            25% {
                top: 340px;
                left: 30px;
            }

            37.5% {
                top: 340px;
                left: 30px;
            }

            50% {
                top: 340px;
                left: calc(100% - 140px);
            }

            62.5% {
                top: 340px;
                left: calc(100% - 140px);
            }

            75% {
                top: 30px;
                left: calc(100% - 140px);
            }

            87.5% {
                top: 30px;
                left: calc(100% - 140px);
            }

            100% {
                top: 30px;
                left: 30px;
            }
        }

        .yena_e_you_part {
            width: calc(100% - 80px);
            height: 400px;
            display: flex;
            overflow: hidden;
            position: absolute;
            top: 0px;
            left: 0px;
            border: 5px solid #191919;
            border-radius: 25px;
        }

        .YenaEventYouModule_e_full {
            width: 30px;
            height: 400px;
            overflow: hidden;
            display: flex;
            position: relative;
            flex-shrink: 0;
        }

        .YenaEventYouModule_e_full>div {
            width: 15px;
            height: 600px;
            position: absolute;
        }

        .YenaEventYouModule_e_full>div>p {
            font-size: 15px;
            line-height: 140%;
            font-weight: 500;
        }

        .yena_e_you_div1 {
            left: 0px;
            animation: yena_e_you_div1 4s linear 0s infinite;
        }

        .yena_e_you_div2 {
            left: 15px;
            animation: yena_e_you_div2 4s linear 0s infinite;
        }

        @keyframes yena_e_you_div1 {
            0% {
                top: 0px;
            }

            50% {
                top: -200px;
            }

            100% {
                top: 0px;
            }
        }

        @keyframes yena_e_you_div2 {
            0% {
                bottom: 0px;
            }

            50% {
                bottom: -200px;
            }

            100% {
                bottom: 0px;
            }
        }
    </style>
</head>
