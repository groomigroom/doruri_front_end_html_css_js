<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10CM 일말의 가능성 이벤트</title>
    <link rel="stylesheet" href="../css/triples/TriplesEvent.css">
    <style>
        .tri_e_last_win_part {
            display: none;
        }
    </style>
</head>

<body>
    <div class="AlldayProjectEvent_full">
        <header class="tri_m_header">
            <Menu />
            <section class="home_translate">
                <Link to='/AlldayProjectEvent' class="on">한국어</Link>
                <Link to='/AlldayProjectEventEng'>English</Link>
            </section>
        </header>
        <section class="tri_e_logo">
            <img src={AlldayProject_e_logo} alt="ALLDAY PROJECT 이벤트 로고" />
        </section>
        <section class="tri_m_h2">
            <h2><img src={MainH2Deco} alt="ALLDAY PROJECT" />간단한 미로 탈출 이벤트<img src={MainH2Deco} alt="ALLDAY PROJECT" />
            </h2>
        </section>
        <section class='tri_m_intropp'>
            <p>
                &apos;A&apos;자를 움직여서<br />
                &apos;o&apos;자를 목적지로<br />
                미로 탈출해 주세요!
            </p>
        </section>
        <section class="alldayproject_e_maze_full">
            <section class="alldayproject_e_maze">
                <section class='alldayproject_e_maze_realfield'>
                    <div class='alldayproject_e_maze_x_box alldayproject_e_maze_x_box1'>
                        <p>x</p>
                    </div>
                    <div class='alldayproject_e_maze_x_box alldayproject_e_maze_x_box2'>
                        <p>x</p>
                    </div>
                    <div class='alldayproject_e_maze_x_box alldayproject_e_maze_x_box3'>
                        <p>x</p>
                    </div>
                    <div class='alldayproject_e_maze_x_box alldayproject_e_maze_x_box4'>
                        <p>x</p>
                    </div>
                    <div class='alldayproject_e_maze_x_box alldayproject_e_maze_x_box5'>
                        <p>x</p>
                    </div>
                    <div class='alldayproject_e_maze_x_box alldayproject_e_maze_x_box6'>
                        <p>x</p>
                    </div>
                    <div class='alldayproject_e_maze_x_box alldayproject_e_maze_x_box7'>
                        <p>x</p>
                    </div>
                    <div class='alldayproject_e_maze_x_box alldayproject_e_maze_x_box8'>
                        <p>x</p>
                    </div>
                    <div class='alldayproject_e_maze_x_box alldayproject_e_maze_x_box9'>
                        <p>x</p>
                    </div>
                    <div class="alldayproject_e_maze_running_box">
                        <p>A</p>
                    </div>
                    <div class='alldayproject_e_maze_goal'>
                        <p>o</p>
                    </div>
                </section>
            </section>
        </section>
        <section class='alldayproject_e_maze_RB_buttons_full'>
            <section class='alldayproject_e_maze_RB_buttons'>
                <button class='alldayproject_e_maze_RB_button alldayproject_e_maze_RB_to_top'
                    onclick="all_e_maze_running_box_go_up()">위로가기</button>
                <button class='alldayproject_e_maze_RB_button alldayproject_e_maze_RB_to_down'
                    onclick="all_e_maze_running_box_go_down()">아래로가기</button>
                <button class='alldayproject_e_maze_RB_button alldayproject_e_maze_RB_to_left'
                    onclick="all_e_maze_running_box_go_left()">왼쪽으로가기</button>
                <button class='alldayproject_e_maze_RB_button alldayproject_e_maze_RB_to_right'
                    onclick="all_e_maze_running_box_go_right()">오른쪽으로가기</button>
            </section>
        </section>
        <FooterPart FooterPartText='ⓒ THEBLACKLABEL' />
        <!-- win popup -->
        <section class="tri_e_last_win_part">
            <div class="tri_e_ghost_40px"></div>
            <section class="tri_m_h2">
                <h2>
                    <img src={MainH2Deco} alt="allday project" />당첨입니다.<img src={MainH2Deco} alt="allday project" />
                </h2>
            </section>
            <section class="tri_e_p_win_intropp">
                <p>
                    당첨을 축하드려요!<br />
                    상품은 자석입니다.<br />
                    이벤트에 관심가져 주셔서 감사합니다.<br />
                    이 이벤트는 가상의 이벤트입니다.<br />
                    참고해 주시길 부탁드리겠습니다.<br />
                </p>
            </section>
            <section class="tri_e_p_win_present_150">
                <img src={AlldayProject_e_magnet} alt="자석" class="alldayproject_e_p_win_present_img" />
            </section>
        </section>
    </div>
    <script>
        const alldayproject_e_maze_running_box = document.querySelector(".alldayproject_e_maze_running_box");
        const tri_e_last_win_part = document.querySelector(".tri_e_last_win_part");
        let all_e_maze_running_box_top = 200;
        let all_e_maze_running_box_left = 120;

        const check_win_condition = () => {
            if (all_e_maze_running_box_top === -40 && all_e_maze_running_box_left === 120) {
                tri_e_last_win_part.style.display = "block";
                console.log("당첨");
            }
        };

        //위쪽으로 이동
        const all_e_maze_running_box_go_up = () => {
            all_e_maze_running_box_top -= 40;
            alldayproject_e_maze_running_box.style.top = `${all_e_maze_running_box_top}px`;
            console.log(all_e_maze_running_box_top);
            check_win_condition();
        };

        //아래쪽으로 이동
        const all_e_maze_running_box_go_down = () => {
            all_e_maze_running_box_top += 40;
            alldayproject_e_maze_running_box.style.top = `${all_e_maze_running_box_top}px`;
            console.log(all_e_maze_running_box_top);
            check_win_condition();
        };

        //왼쪽으로 이동
        const all_e_maze_running_box_go_left = () => {
            all_e_maze_running_box_left -= 40;
            alldayproject_e_maze_running_box.style.left = `${all_e_maze_running_box_left}px`;
            console.log(all_e_maze_running_box_left);
            check_win_condition();
        };

        //오른쪽으로 이동
        const all_e_maze_running_box_go_right = () => {
            all_e_maze_running_box_left += 40;
            alldayproject_e_maze_running_box.style.left = `${all_e_maze_running_box_left}px`;
            console.log(all_e_maze_running_box_left);
            check_win_condition();
        };


    </script>
</body>

</html>
