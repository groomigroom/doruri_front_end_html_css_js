<script>
    const Menu_button = document.querySelector(".Menu_button");
    const header_wrap = document.querySelector(".header_wrap");

    Menu_button.addEventListener("click", () => {
        header_wrap.classList.toggle("on");
        if (Menu_button.classList.contains("off")) {
            Menu_button.classList.remove("off");
            Menu_button.classList.add("on");
        } else {
            Menu_button.classList.remove("on");
            Menu_button.classList.add("off");
        }
    });
    //9개 박스들 선언하기
    const ioi_boxs = [];
    const ioi_boxs_member_things_p = [];
    for (let i = 0; i < 9; i++) {
        ioi_boxs.push(document.querySelector(`.ioi_box_${i + 1}>p:nth-child(1)`));
        ioi_boxs_member_things_p.push(document.querySelector(`.ioi_box_${i + 1}>p:nth-child(2)`));
    }

    console.log(ioi_boxs);
    //멤버들 순서대로 랜덤 숫자 배정하기
    const members_name_list = ["1번", "2번", "3번", "4번", "5번", "6번", "7번", "8번", "9번",];
    const members = members_name_list.map((name) => ({
        member_name: name,
        member_thing: Math.floor(Math.random() * 9) + 1
    }));
    for (let i = 0; i < ioi_boxs.length; i++) {
        ioi_boxs[i].textContent = members_name_list[i];
        ioi_boxs_member_things_p[i].textContent = members[i].member_thing + "개";
    }
    console.log(members);

    //문제 맞추기 시작하기
    let ioi_go_to_answer = document.querySelector(".ioi_go_to_answer");
    let ioi_answer_button_array = [];
    for (let i = 1; i < 10; i++) {
        ioi_answer_button_array.push(document.querySelector(`.ioi_answer_button${i}`));
    }
    ioi_go_to_answer.addEventListener("click", () => {
        // 💡 member_thing 기준 내림차순 정렬
        members.sort((a, b) => {
            if (a.member_thing === b.member_thing) {
                return 0; // 동점자 자리 유지
            }
            return b.member_thing - a.member_thing; // b에서 a를 빼면 내림차순이 됩니다.
        });
        console.log(members);
        for(let i = 0; i < 9; i++) {
            ioi_answer_button_array[i].style.display = "block";
        }
        let ioi_last_real_answer = Math.floor(Math.random()*9)+1;
        console.log(ioi_last_real_answer + "최종 정답");
        let ioi_answer_quiz = document.querySelector(".ioi_answer_quiz");
        ioi_answer_quiz.textContent = ioi_last_real_answer + "번째로 물건이 많은 사람은?";

        let user_last_answer = "";
        let ioi_e_p_win = document.querySelector(".ioi_e_p_win");
        let ioi_e_p_lose = document.querySelector(".ioi_e_p_lose");
        ioi_answer_button_array.forEach((an_button, index)=> {
            an_button.addEventListener("click", ()=>{
                user_last_answer = members_name_list[index];
                console.log(user_last_answer);
                if (user_last_answer === members[ioi_last_real_answer-1].member_name) {
                    console.log("정답");
                    ioi_e_p_win.style.display = "block";
                } else {
                    console.log("정답아님");
                    ioi_e_p_lose.style.display = "block";
                }
            });
        });

    });
</script>
