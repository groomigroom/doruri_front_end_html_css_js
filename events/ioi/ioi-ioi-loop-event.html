<!DOCTYPE html>

<head>

<body>
    <script>
        const members = ["1번", "2번", "3번", "4번", "5번", "6번", "7번", "8번", "9번",];
        let member_things = [];
        for (let i = 0; i < 9; i++) {
            let n = Math.floor(Math.random() * 9) + 1;
            member_things.push(n);
        }

        console.log(members);
        console.log(member_things);


        //정렬
        const member_things_sort = () => {
            const n = member_things.length;
            for (let i = 0; i < n - 1; i++) {
                let minIdx = i;
                for (let k = i + 1; k < n; k++) {
                    if (member_things[minIdx] > member_things[i]) {
                        let tmp2 = member_things[i];
                        member_things[i] = member_things[minIdx];
                        member_things[minIdx] = tmp2;

                        let tmp1 = members[i];
                        members[i] = members[minIdx];
                        members[minIdx] = tmp1;
                    }
                }
            }
            console.log(members);
            console.log(member_things);
        };

        member_things_sort();

    </script>
</body>
