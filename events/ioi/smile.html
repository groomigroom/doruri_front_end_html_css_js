<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>akmu 2 이벤트</title>
    <link rel="stylesheet" href="../css/triples/TriplesEvent.css">
    <style>
        .last_win {
            display: none;
        }

        .last_lose {
            display: none;
        }

        .akmu_2_1div {
            width: 100px;
            height: 100px;
            position: absolute;
            animation: akmu_2_1_div 2s linear 0s infinite;
            background-color: bisque;
        }

        @keyframes akmu_2_1_div {
            0% {
                top: 100px;
                left: 100px;
            }

            50% {
                top: 200px;
                left: 200px;
            }

            100% {
                top: 100px;
                left: 100px;
            }
        }
    </style>
</head>

<body>
    <div>
        <section class="ioi_e_full">
            <div class="ioi_e_move_div"></div>
        </section>

        <section class="last_win">
            <p>당첨</p>
        </section>

    </div>

    <script>
        
    </script>
</body>

</html>
