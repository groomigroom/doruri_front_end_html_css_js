<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ioi 2</title>
    <link rel="stylesheet" href="../css/triples/TriplesEvent.css">
    <style>
        .last_win {
            display: none;
        }

        .last_lose {
            display: none;
        }

        .ioi_e_move_div {
            width: 50px;
            height: 50px;
            background-color: bisque;
        }
    </style>
</head>

<body>
    <div>
        <section class="ioi_e_full">
            <div class="ioi_e_move_div"></div>
        </section>

        <section class="last_win">
            <p>당첨</p>
        </section>

    </div>

    <script>
        const ioi_e_move_div = document.querySelector(".ioi_e_move_div");

        let top_position = 200;
        let left_position = 200;
        const position_value = 10;

        window.addEventListener("keydown", (event) => {
            switch (event.code) {
                case "ArrowUp":
                    top_position -= position_value;
                    break;
                case "ArrowDown":
                    top_position += position_value;
                    break;
                case "ArrowLeft":
                    left_position -= position_value;
                    break;
            }
        })
    </script>
</body>

</html>
