<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ioi 2</title>
    <link rel="stylesheet" href="../css/triples/TriplesEvent.css">
    <style>
        .last_win {
            display: none;
        }

        .last_lose {
            display: none;
        }

        .ioi_e_full {
            width: 400px;
            height: 400px;
            position: relative;
        }

        .ioi_e_move_div {
            width: 50px;
            height: 50px;
            background-color: bisque;
            position: absolute;
        }
    </style>
</head>

<body>
    <div>
        <section class="ioi_e_full">
            <div class="ioi_e_move_div"></div>
        </section>

        <section class="last_win">
            <p>당첨</p>
        </section>

    </div>

    <script>
        const ioi_e_move_div = document.querySelector(".ioi_e_move_div");

        let top_position = 200;
        let left_position = 200;
        const position_value = 10;

        window.addEventListener("keydown", (event) => {
            switch (event.code) {
                case "ArrowUp":
                    top_position -= position_value;
                    break;
                case "ArrowDown":
                    top_position += position_value;
                    break;
                case "ArrowLeft":
                    left_position -= position_value;
                    break;
                case "ArrowRight":
                    left_position += position_value;
                    break;
                default:
                    return;
            }

            //화살표 키로 화면이 내려가는 현상 방지하기
            event.preventDefault();

            ioi_e_move_div.style.top = `${top_position + "px"}`;
            ioi_e_move_div.style.left = `${left_position + "px"}`;
        });
    </script>
</body>

</html>
