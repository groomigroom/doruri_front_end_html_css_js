<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10CM 일말의 가능성 이벤트</title>
    <link rel="stylesheet" href="../css/triples/TriplesEvent.css">
    <style>
        .last_win {
            display: none;
        }

        .last_lose {
            display: none;
        }
    </style>
</head>

<body>
    <div>
        <!-- <p>다음에 대기할 멤버는 {Btob_e_wait_arr[0]}입니다.</p>
        <section>
            <p>공연 중인 멤버는{Btob_e_con_start_mem}</p>
        </section>
        <p>대기 중인 멤버는 {Btob_e_con_real_wait_mem}입니다.</p>
        <p>대기 입장 전 멤버</p>
        <p>{Btob_e_wait_arr[0]}</p>
        <p>{Btob_e_wait_arr[1]}</p>
        <p>{Btob_e_wait_arr[2]}</p>
        <p>{Btob_e_wait_arr[3]}</p>
        <p>{Btob_e_wait_arr[4]}</p>
        <p>{Btob_e_wait_arr[5]}</p>
        <p>점수는 {Btob_e_last_count}</p> -->
        <button onclick="btob_e_mem_end()">공연 끝내기</button>
        <button onclick="btob_e_mem_start()">공연 시작하기</button>
        <button onclick="btob_e_1mem_wait()">1번 멤버 대기</button>
        <button onclick="btob_e_2mem_wait()">2번 멤버 대기</button>
        <button onclick="btob_e_3mem_wait()">3번 멤버 대기</button>
        <button onclick="btob_e_4mem_wait()">4번 멤버 대기</button>
        <button onclick="btob_e_5mem_wait()">5번 멤버 대기</button>
        <button onclick="btob_e_6mem_wait()">6번 멤버 대기</button>
        {Btob_e_last_count === 6 && (
        <section class="last_win">
            <p>당첨</p>
        </section>
        )}
        <section class="last_lose">
            <p>당첨이 아닙니다.</p>
        </section>
    </div>

    <script>
        const number_random = new Set();

        while (number_random.size < 6) {
            const num = Math.floor(Math.random() * 6);
            number_random.add(num);
        }

        const number_random_arr = [...number_random];

        let member_wait_arr = [];
        member_wait_arr[number_random_arr[0]] = "1번";
        member_wait_arr[number_random_arr[1]] = "2번";
        member_wait_arr[number_random_arr[2]] = "3번";
        member_wait_arr[number_random_arr[3]] = "4번";
        member_wait_arr[number_random_arr[4]] = "5번";
        member_wait_arr[number_random_arr[5]] = "6번";
        console.log(member_wait_arr);

        let user_member_array = [];

        let user_wait_member = "";

        //1번 멤버 대기
        const btob_e_1mem_wait = () => {
            user_wait_member = "1번";
            console.log(user_wait_member);
        };

        //2번 멤버 대기
        const btob_e_2mem_wait = () => {
            user_wait_member = "2번";
            console.log(user_wait_member);
        };

        //3번 멤버 대기
        const btob_e_3mem_wait = () => {
            user_wait_member = "3번";
            console.log(user_wait_member);
        };

        //4번 멤버 대기
        const btob_e_4mem_wait = () => {
            user_wait_member = "4번";
            console.log(user_wait_member);
        };

        //5번 멤버 대기
        const btob_e_5mem_wait = () => {
            user_wait_member = "5번";
            console.log(user_wait_member);
        };

        //6번 멤버 대기
        const btob_e_6mem_wait = () => {
            user_wait_member = "6번";
            console.log(user_wait_member);
        };

        let user_start_member = "";

        const last_lose = document.querySelector(".last_lose");
        const last_win = document.querySelector(".last_win");

        //공연 시작하기
        const btob_e_mem_start = () => {
            if (user_wait_member === "" || user_start_member !== "") {
                last_lose.style.display = "block";
            } else {
                user_start_member = user_wait_member;
                user_wait_member = "";
                console.log(user_wait_member)
                console.log(user_start_member)
            }
        };

        let btob_e_last_check_count = 0;

        const btob_e_last_check = () => {
            btob_e_last_check_count = 0;
            for(let i = 0; i < member_wait_arr.length; i++) {
                if(user_member_array[i] === member_wait_arr[i]) {
                    btob_e_last_check_count++;
                }
            }
            if(user_member_array.length === 6) {
                if (btob_e_last_check_count === 6) {
                    last_win.style.display = "block";
                } else {
                    last_lose.style.display = "block";
                }
            }
        };

        //공연 끝내기
        const btob_e_mem_end = () => {
            if (user_start_member !== "") {
                user_member_array.push(user_start_member);
                console.log(user_member_array);
                user_start_member = "";
            } else {
                last_lose.style.display = "block";
            }
            btob_e_last_check();
        };
    </script>
</body>

</html>
