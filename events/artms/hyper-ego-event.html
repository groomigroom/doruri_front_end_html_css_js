        <section class="tri_m_h2">
            <h2>▪ 정답 정렬칸 ▪</h2>
        </section>
        <section class="artms_e_array artms_e_correct_array">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </section>
        <button class='artms_e_correct_arr_append' onclick="append_to_after()">뒤에 추가하기</button>
        <input class='artms_e_correct_arr_ins_num' type="text" name="artms_e_correct_arr_ins_num">
        <button class='artms_e_correct_arr_insert' onclick="">사이에 삽입하기</button>
        <button class='artms_e_correct_arr_pop' onclick="">사이에서 삭제하기</button>
        <h2 class="tri_e_h2 artms_e_h2_3">▪ 기존 배열칸?? ▪</h2>
        <section class="artms_e_array artms_e_before_array">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </section>
        <!-- win popup -->
        <section class='artms_e_real_result'>
            <p>당첨</p>
        </section>
    </div>
    <script>
        const number_random = new Set();

        while (number_random.size < 5) {
            const num = Math.floor(Math.random() * 5);
            number_random.add(num);
        }
        const number_random_arr = [...number_random];

        let member_before = [];
        member_before[number_random_arr[0]] = "1번";
        member_before[number_random_arr[1]] = "2번";
        member_before[number_random_arr[2]] = "3번";
        member_before[number_random_arr[3]] = "4번";
        member_before[number_random_arr[4]] = "5번";

        //기존 배열 칸에 집어넣기
        const artms_e_before_array_div1 = document.querySelector(".artms_e_before_array>div:nth-child(1)");
        const artms_e_before_array_div2 = document.querySelector(".artms_e_before_array>div:nth-child(2)");
        const artms_e_before_array_div3 = document.querySelector(".artms_e_before_array>div:nth-child(3)");
        const artms_e_before_array_div4 = document.querySelector(".artms_e_before_array>div:nth-child(4)");
        const artms_e_before_array_div5 = document.querySelector(".artms_e_before_array>div:nth-child(5)");
        const artms_e_before_array_div_arr = [artms_e_before_array_div1, artms_e_before_array_div2, artms_e_before_array_div3,
            artms_e_before_array_div4, artms_e_before_array_div5];
        const artms_e_correct_array_div1 = document.querySelector(".artms_e_correct_array>div:nth-child(1)");
        const artms_e_correct_array_div2 = document.querySelector(".artms_e_correct_array>div:nth-child(2)");
        const artms_e_correct_array_div3 = document.querySelector(".artms_e_correct_array>div:nth-child(3)");
        const artms_e_correct_array_div4 = document.querySelector(".artms_e_correct_array>div:nth-child(4)");
        const artms_e_correct_array_div5 = document.querySelector(".artms_e_correct_array>div:nth-child(5)");
        const artms_e_correct_array_div_arr = [artms_e_correct_array_div1, artms_e_correct_array_div2, artms_e_correct_array_div3,
            artms_e_correct_array_div4, artms_e_correct_array_div5];
        for (let i = 0; i < 5; i++) {
            artms_e_before_array_div_arr[i].textContent = member_before[i];
        }

        //정답 배열칸 만들기 및 함수
        let number_after = [];
        const append_to_after = () => {
            if (number_after.length < 5) {
                number_after.push(member_before[0]);
                console.log(number_after);
                for (let i = 0; i < number_after.length; i++) {
                    artms_e_correct_array_div_arr[i].textContent = number_after[i];
                }
                for (let i = 1; i < member_before.length; i++) {
                    member_before[i - 1] = member_before[i];
                }
                member_before[member_before.length - 1] = null;
                for (let i = 0; i < member_before.length; i++) {
                    artms_e_before_array_div_arr[i].textContent = member_before[i];
                }
            }
        };

        const delete_to_after = () => { };

    </script>
</body>
