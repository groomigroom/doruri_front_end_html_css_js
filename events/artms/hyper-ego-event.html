<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10CM 일말의 가능성 이벤트</title>
    <link rel="stylesheet" href="../css/triples/TriplesEvent.css">

</head>

<body>
    <div class="ArtmsEvent_full">
        <header class="tri_m_header">
            <Menu />
            <section class="home_translate">
                <Link to='/ArtmsEvent' class="on">한국어</Link>
                <Link to='/ArtmsEventEng'>English</Link>
            </section>
        </header>
        <section class="tri_e_logo">
            <img src={""} alt="ARTMSELogo" />
        </section>
        <section class="tri_m_h2">
            <h2>
                <img src={MainH2Deco} alt="ARTMS" />멤버 이름 가나다 순서로 정렬하기 이벤트<img src={MainH2Deco} alt="ARTMS" />
            </h2>
        </section>
        <section class='tri_m_intropp'>
            <p>
                &apos;ARTMS&apos; 멤버들의<br />
                이름을 가나다 순서대로<br />
                정렬해 주세요!
            </p>
        </section>
        <section class="tri_m_h2">
            <h2>▪ 정답 정렬칸 ▪</h2>
        </section>
        <section class="artms_e_array artms_e_correct_array">
            <div>{artms_e_correct_arr[0]}</div>
            <div>{artms_e_correct_arr[1]}</div>
            <div>{artms_e_correct_arr[2]}</div>
            <div>{artms_e_correct_arr[3]}</div>
            <div>{artms_e_correct_arr[4]}</div>
        </section>
        <button class='artms_e_correct_arr_append' onclick="">뒤에 추가하기</button>
        <input class='artms_e_correct_arr_ins_num' type="text" name="artms_e_correct_arr_ins_num">
        <button class='artms_e_correct_arr_insert' onclick="">사이에 삽입하기</button>
        <button class='artms_e_correct_arr_pop' onclick="">사이에서 삭제하기</button>
        <h2 class="tri_e_h2 artms_e_h2_3">▪ 기존 배열칸?? ▪</h2>
        <section class="artms_e_array artms_e_before_array">
            <div></div>
            <div></div>
            <div></div>
            <div>{artms_e_before_arr[3]}</div>
            <div>{artms_e_before_arr[4]}</div>
        </section>
        <!-- win popup -->
        <section class='artms_e_real_result'>
            <p>당첨</p>
        </section>
    </div>
    <script>
        const number_random = new Set();

        while (number_random.size < 5) {
            const num = Math.floor(Math.random() * 5);
            number_random.add(num);
        }
        const number_random_arr = [...number_random];

        let member_before = [];
        member_before[number_random_arr[0]] = "1번";
        member_before[number_random_arr[1]] = "2번";
        member_before[number_random_arr[2]] = "3번";
        member_before[number_random_arr[3]] = "4번";
        member_before[number_random_arr[4]] = "5번";

        //기존 배열 칸에 집어넣기
        const artms_e_before_array_div1 = document.querySelector(".artms_e_before_array>div:nth-child(1)");
        const artms_e_before_array_div2 = document.querySelector(".artms_e_before_array>div:nth-child(2)");
        const artms_e_before_array_div3 = document.querySelector(".artms_e_before_array>div:nth-child(3)");
        const artms_e_before_array_div4 = document.querySelector(".artms_e_before_array>div:nth-child(4)");
        const artms_e_before_array_div5 = document.querySelector(".artms_e_before_array>div:nth-child(5)");
        artms_e_before_array_div1.textContent = member_before[0];
        artms_e_before_array_div2.textContent = member_before[1];
        artms_e_before_array_div3.textContent = member_before[2];
        artms_e_before_array_div4.textContent = member_before[3];
        artms_e_before_array_div5.textContent = member_before[4];
    </script>
</body>

</html>
