<body>
    <button onclick="append_to_member_after()">after에삽입하기</button>
    <input type="text" name="want_position">
    <button onclick="delete_to_number_after()">after에서 원하는 위치에서 삭제하기</button>
    <button onclick="insert_to_number_after()">after에서 원하는 위치에 삽입하기</button>
    <script>
        const number_random = new Set();

        while (number_random.size < 5) {
            const num = Math.floor(Math.random() * 5);
            number_random.add(num);
        }
        const number_random_arr = [...number_random];

        let member_before = [];
        member_before[number_random_arr[0]] = "1번";
        member_before[number_random_arr[1]] = "2번";
        member_before[number_random_arr[2]] = "3번";
        member_before[number_random_arr[3]] = "4번";
        member_before[number_random_arr[4]] = "5번";
        let member_after = [];

        console.log("이전");
        console.log(member_before);
        console.log("이후");
        console.log(member_after);

        const member_after_check = () => {
            if (member_after == ["1번", "2번", "3번", "4번", "5번"]) {

            }
        };

        /*

        const append_to_member_after = () => {
            if (member_before.length != 0) {
                member_after.push(member_before[0]);

                //1개 요소 삭제하기
                member_before.splice(0, 1);
                console.log("이전");
                console.log(member_before);
                console.log("이후");
                console.log(member_after);
            }
        };

        const want_position = document.querySelector("input[name = \"want_position\"]");

        const insert_to_number_after = () => {           
            let want_position_num = parseInt(want_position.value);
            if(want_position_num >= 1 && want_position_num <= 5 && member_before.length > 0) {
                member_after.splice(want_position_num-1, 0, member_before[0]);
                member_before.splice(0, 1);
                console.log("이전");
                console.log(member_before);
                console.log("이후");
                console.log(member_after);
            }
        };

        const delete_to_number_after = () => {
            let want_position_num = parseInt(want_position.value);
            if(want_position_num >= 1 && want_position_num <= 5 && member_after.length > 0) {
                member_before.push(member_after[want_position_num-1]);
                member_after.splice(want_position_num-1, 1);
                console.log("이전");
                console.log(member_before);
                console.log("이후");
                console.log(member_after);
            } 
        };

    </script>
</body>
