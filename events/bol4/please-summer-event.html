<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10CM 일말의 가능성 이벤트</title>
    <link rel="stylesheet" href="../css/triples/TriplesEvent.css">
    <style>
        .tri_e_last_win_part {
            display: none;
        }
    </style>
</head>

<body>
    <div class="bol4Event_full">
        <header class="tri_m_header">
            <Menu />
            <section class="home_translate">
                <Link to='/Bol4Event' class="on">한국어</Link>
                <Link to='/Bol4EventEng'>English</Link>
            </section>
        </header>
        <section class="tri_e_logo">
            <img src={bol4_e_logo} alt="볼빨간사춘기 이벤트 로고" />
        </section>
        <section class="tri_m_h2">
            <h2><img src={MainH2Deco} alt="볼빨간사춘기" />앨범 제목 클릭 이벤트<img src={MainH2Deco} alt="볼빨간사춘기" /></h2>
        </section>
        <section class='tri_m_intropp'>
            <p>
                &apos;볼빨간사춘기&apos;<br />
                앨범 제목을<br />
                클릭해 주세요!
            </p>
        </section>
        <section class="bol4_e_event_real_part_full">
            <section class="bol4_e_event_real_part">
                <div class="bol4_e_event_r_p_mbox bol4_e_event_r_p_mbox1"></div>
                <div class="bol4_e_event_r_p_mbox bol4_e_event_r_p_mbox2"></div>
                <div class="bol4_e_event_r_p_mbox bol4_e_event_r_p_mbox3"></div>
                <div class="bol4_e_event_r_p_mbox bol4_e_event_r_p_mbox4"></div>
                <div class="bol4_e_event_r_p_mbox bol4_e_event_r_p_mbox5"></div>
                <div class="bol4_e_event_r_p_mbox bol4_e_event_r_p_mbox6"></div>
                <div class="bol4_e_event_r_p_mbox bol4_e_event_r_p_mbox7"></div>
                <div class="bol4_e_event_r_p_mbox bol4_e_event_r_p_mbox8"></div>
                <p class="bol4_e_event_r_p_m_pp" onclick="OpBol4_e_last_result()">여름아 부탁해</p>
            </section>
        </section>
        <FooterPart FooterPartText='ⓒ 켄버스' />
        <!-- win popup -->
        <section class="tri_e_last_win_part">
            <div class="tri_e_ghost_40px"></div>
            <section class="tri_m_h2">
                <h2>
                    <img src={MainH2Deco} alt="볼빨간사춘기" />당첨입니다.<img src={MainH2Deco} alt="볼빨간사춘기" />
                </h2>
            </section>
            <section class="tri_e_p_win_intropp">
                <p>
                    당첨을 축하드려요!<br />
                    상품은 전등입니다.<br />
                    이벤트에 관심가져 주셔서 감사합니다.<br />
                    이 이벤트는 가상의 이벤트입니다.<br />
                    참고해 주시길 부탁드리겠습니다.<br />
                </p>
            </section>
            <section class="tri_e_p_win_present_150">
                <img src={bol4_e_blub} alt="" class="triples_e_p_win_present_img" />
            </section>
        </section>
    </div>
    <script>
        const tri_e_last_win_part = document.querySelector(".tri_e_last_win_part");
        const OpBol4_e_last_result = () => {
            tri_e_last_win_part.style.display = "block";
        };
    </script>
</body>

</html>
