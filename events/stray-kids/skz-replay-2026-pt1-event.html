<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10CM 일말의 가능성 이벤트</title>
    <link rel="stylesheet" href="../css/triples/TriplesEvent.css">
    <style>
        .tri_e_last_win_part,
        input[name="straykids_e_value2"],
        input[name="straykids_e_value3"] {
            display: none;
        }

        .tri_e_last_win_part.on,
        input[name="straykids_e_value2"].on,
        input[name="straykids_e_value3"].on {
            display: block;
        }
    </style>
</head>

<body>
    <div class="straykidsEvent_full">
        <header class="tri_m_header">
            <Menu />
            <section class="home_translate">
                <Link to='/TxtEvent' class="on">한국어</Link>
                <Link to='/TxtEventEng'>English</Link>
            </section>
        </header>
        <section class="tri_e_logo">
            <img src={StrayKids_e_m_logo} alt="Stray Kids 이벤트 로고" />
        </section>
        <section class="tri_m_h2">
            <h2><img src={MainH2Deco} alt="Stray Kids" />노래 제목 맞히기 이벤트<img src={MainH2Deco} alt="Stray Kids" /></h2>
        </section>
        <section class='tri_m_intropp'>
            <p>
                &apos;SKZ-REPLAY 2026 Pt.1&apos; 앨범의<br />
                1, 2, 3번 수록곡<br />
                제목을 맞혀 주세요!
            </p>
        </section>
        <form action="" class="str_e_form_part">
            <section class="tri_m_h2">
                <h2>1번답 입력</h2>
            </section>
            <div class="str_e_form_indiv_wrap">
                <div class="str_e_form_indiv">
                    <input type="text" name="straykids_e_value1">
                </div>
            </div>
            <!--1 is correct-->
            <section class="tri_m_h2">
                <h2>2번답 입력</h2>
            </section>
            <div class="str_e_form_indiv_wrap">
                <div class="str_e_form_indiv">
                    <input type="text" name="straykids_e_value2">
                </div>
            </div>
            <!--2 is coreect-->
            <section class="tri_m_h2">
                <h2>3번답 입력</h2>
            </section>
            <div class="str_e_form_indiv_wrap">
                <div class="str_e_form_indiv">
                    <input type="text" name="straykids_e_value3">
                </div>
            </div>
            <FooterPart100vh FooterPartText='ⓒ JYP엔터테인먼트' />
            <!--last popup-->
            <section class="tri_e_last_win_part">
                <div class="tri_e_ghost_40px"></div>
                <section class="tri_m_h2">
                    <h2>
                        <img src={MainH2Deco} alt="stray kids" />당첨입니다.<img src={MainH2Deco} alt="stray kids" />
                    </h2>
                </section>
                <section class="tri_e_p_win_intropp">
                    <p>
                        당첨을 축하드려요!<br />
                        상품은 가사집입니다.<br />
                        이벤트에 관심가져 주셔서 감사합니다.<br />
                        이 이벤트는 가상의 이벤트입니다.<br />
                        참고해 주시길 부탁드리겠습니다.<br />
                    </p>
                </section>
                <section class="tri_e_p_win_present_150">
                    <div class="stray_e_win_present triples_e_p_win_present_img">
                        <h3>▪ 가사집 ▪</h3>
                        <p>가사 내용<br />
                            ----------------<br />
                            ----------------<br />
                            ----------------
                        </p>
                    </div>
                </section>
            </section>
        </form>
    </div>
    <script>
        // 1. 올바른 상수 선언 (cont -> const 변경 및 DOM 요소 선택 예시)
        const straykids_e_value1 = document.querySelector("input[name=\"straykids_e_value1\"]");
        const straykids_e_value2 = document.querySelector("input[name=\"straykids_e_value2\"]");
        const straykids_e_value3 = document.querySelector("input[name=\"straykids_e_value3\"]");
        const tri_e_last_win_part = document.querySelector(".tri_e_last_win_part");

        // 2. 각 입력창의 상태를 체크하는 하나의 함수 만들기
        function checkValues() {
            // 첫 번째 조건 확인
            if (straykids_e_value1.value === "Battle Ground") {
                straykids_e_value2.classList.add("on");

                // 두 번째 조건 확인
                if (straykids_e_value2.value === "Roman Empire") {
                    straykids_e_value3.classList.add("on");

                    // 세 번째 조건 확인
                    if (straykids_e_value3.value === "LOVER") {
                        tri_e_last_win_part.classList.add("on");
                    }
                }
            }
        }

        // 3. 각각의 입력창에 독립적으로 이벤트 리스너 연결
        straykids_e_value1.addEventListener("input", checkValues);
        straykids_e_value2.addEventListener("input", checkValues);
        straykids_e_value3.addEventListener("input", checkValues);
    </script>
</body>

</html>
