                    <p>

                </section>
                <section class="tri_e_p_win_present_150">
                    <img src="" alt="" class="triples_e_p_win_present_img" />
                </section>
            </section>

        </section>
        <FooterPart FooterPartText='ⓒ 켄버스' />
    </div>
    <script>

            constructor(name, next_name_class) {
                // 올바른 필드 초기화 (this 사용)
                this.name = name;
                this.next_name_class = next_name_class;
            }

            setNextNameClass(to_set_next_name_class) {
                // 인스턴스 변수에 올바르게 할당
                this.next_name_class = to_set_next_name_class;
            }
        }

        // 일반 따옴표("") 사용

        const idntt_id16 = new IdnttMemberConnectList("16번", null);
        const idntt_id17 = new IdnttMemberConnectList("17번", null);
        const idntt_id18 = new IdnttMemberConnectList("18번", null);
        const idntt_id19 = new IdnttMemberConnectList("19번", null);
        const idntt_id20 = new IdnttMemberConnectList("20번", null);
        const idntt_id21 = new IdnttMemberConnectList("21번", null);

        const idntt_e_mem_node1 = document.querySelector(".idntt_e_mem_node1");
        const idntt_e_mem_node2 = document.querySelector(".idntt_e_mem_node2");
        const idntt_e_mem_node3 = document.querySelector(".idntt_e_mem_node3");
        const idntt_e_mem_node4 = document.querySelector(".idntt_e_mem_node4");
        const idntt_e_mem_node5 = document.querySelector(".idntt_e_mem_node5");
        const idntt_e_mem_node6 = document.querySelector(".idntt_e_mem_node6");
        const idntt_e_mem_node7 = document.querySelector(".idntt_e_mem_node7");

        idntt_e_mem_node1.textContent = idntt_id1.name;

        const idntt_id1_link = () => {
            idntt_id1.setNextNameClass(idntt_id2);
            idntt_e_mem_node2.textContent = idntt_id2.name;
            idntt_e_mem_node2.style.display = "block";

        const idntt_id2_link = () => {

        const idntt_id3_link = () => {

        };

        };
