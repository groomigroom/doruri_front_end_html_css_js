<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10CM 일말의 가능성 이벤트</title>
    <link rel="stylesheet" href="../css/triples/TriplesEvent.css">
    <style>
        .tri_e_last_win_part {
            display: none;
        }
    </style>
</head>

<body>
    <div class="AespaEvent_full">
        <header class="tri_m_header">
            <Menu />
            <section class="home_translate">
                <Link to='/AespaEvent' class="on">한국어</Link>
                <Link to='/AespaEventEng'>English</Link>
            </section>
        </header>
        <section class="tri_e_logo">
            <img src={Aespa_e_m_logo} alt="aespa 이벤트 로고" />
        </section>
        <section class="tri_m_h2">
            <h2><img src={MainH2Deco} alt="aespa" />앨범 제목 1글자씩 맞히기 이벤트<img src={MainH2Deco} alt="aespa" /></h2>
        </section>
        <section class='tri_m_intropp'>
            <p>
                2026년 5월 29일에<br />
                발매된 &apos;aespa&apos;의<br />
                앨범 제목을 1글자씩 맞혀 보세요!
            </p>
        </section>
        <section class="aespa_e_intropp2">
            <p></p>
        </section>
        <form class="aespa_e_form" action="">
            <input class="aespa_e_value" type="text" name="aespa_e_value1">
            <input class="aespa_e_value" type="text" name="aespa_e_value2">
            <input class="aespa_e_value" type="text" name="aespa_e_value3">
            <input class="aespa_e_value" type="text" name="aespa_e_value4">
            <input class="aespa_e_value" type="text" name="aespa_e_value5">
            <input class="aespa_e_value" type="text" name="aespa_e_value6">
            <input class="aespa_e_value" type="text" name="aespa_e_value7">
            <input class="aespa_e_value" type="text" name="aespa_e_value8">
        </form>
        <FooterPart100vh FooterPartText='ⓒ SM엔터테인먼트' />
        <!--popup-->
        <section class="tri_e_last_win_part">
            <div class="tri_e_ghost_40px"></div>
            <section class="tri_m_h2">
                <h2>
                    <img src={MainH2Deco} alt="stray kids" />당첨입니다.<img src={MainH2Deco} alt="stray kids" />
                </h2>
            </section>
            <section class="tri_e_p_win_intropp">
                <p>
                    당첨을 축하드려요!<br />
                    상품은 반지입니다.<br />
                    이벤트에 관심가져 주셔서 감사합니다.<br />
                    이 이벤트는 가상의 이벤트입니다.<br />
                    참고해 주시길 부탁드리겠습니다.<br />
                </p>
            </section>
            <section class="tri_e_p_win_present_150">
                <img src={Aespa_e_present_ring} alt="반지" class="triples_e_p_win_present_img" />
            </section>
        </section>
    </div>
    <script>
        const aespa_e_intropp2_pp = document.querySelector(".aespa_e_intropp2>p");
        aespa_e_intropp2_pp.textContent = "현재: 1번째 글자";
        const aespa_e_value1 = document.querySelector("input[name=\"aespa_e_value1\"]");
        const aespa_e_value2 = document.querySelector("input[name=\"aespa_e_value2\"]");
        const aespa_e_value3 = document.querySelector("input[name=\"aespa_e_value3\"]");
        const aespa_e_value4 = document.querySelector("input[name=\"aespa_e_value4\"]");
        const aespa_e_value5 = document.querySelector("input[name=\"aespa_e_value5\"]");
        const aespa_e_value6 = document.querySelector("input[name=\"aespa_e_value6\"]");
        const aespa_e_value7 = document.querySelector("input[name=\"aespa_e_value7\"]");
        const aespa_e_value8 = document.querySelector("input[name=\"aespa_e_value8\"]");
        const tri_e_last_win_part = document.querySelector(".tri_e_last_win_part");

        function aespa_e_check_values() {
            if (aespa_e_value1.value === "l") {
                aespa_e_intropp2_pp.textContent = "현재: 2번째 글자";
                if (aespa_e_value2.value === "e") {
                    aespa_e_intropp2_pp.textContent = "현재: 3번째 글자";
                    if (aespa_e_value3.value === "m") {
                        aespa_e_intropp2_pp.textContent = "현재: 4번째 글자";
                        if (aespa_e_value4.value === "o") {
                            aespa_e_intropp2_pp.textContent = "현재: 5번째 글자";
                            if (aespa_e_value5.value === "n") {
                                aespa_e_intropp2_pp.textContent = "현재: 6번째 글자";
                                if (aespa_e_value6.value === "a") {
                                    aespa_e_intropp2_pp.textContent = "현재: 7번째 글자";
                                    if (aespa_e_value7.value === "d") {
                                        aespa_e_intropp2_pp.textContent = "현재: 8번째 글자";
                                        if (aespa_e_value8.value === "e") {
                                            tri_e_last_win_part.style.display = "block";
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
        aespa_e_value1.addEventListener("input", aespa_e_check_values);
        aespa_e_value2.addEventListener("input", aespa_e_check_values);
        aespa_e_value3.addEventListener("input", aespa_e_check_values);
        aespa_e_value4.addEventListener("input", aespa_e_check_values);
        aespa_e_value5.addEventListener("input", aespa_e_check_values);
        aespa_e_value6.addEventListener("input", aespa_e_check_values);
        aespa_e_value7.addEventListener("input", aespa_e_check_values);
        aespa_e_value8.addEventListener("input", aespa_e_check_values);
    </script>
</body>

</html>
