<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aespa LEMONADE 이벤트</title>
    <link rel="stylesheet" href="../../group-main/triples/css/TriplesMain.css">
    <link rel="stylesheet" href="../triples/css/TriplesEvent.css">
    <style>
        .aespa_e_intropp2 {
            width: 100vw;
            height: 55px;
            position: relative;
        }

        .aespa_e_intropp2 > p {
            text-align: center;
            font-size: 15px;
            line-height: 15px;
            font-weight: 500;
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
        }

        .aespa_e_form {
            width: 100vw;
            height: 120px;
            position: relative;
        }

        .aespa_e_value {
            position: absolute;
            width: 150px;
            height: 30px;
            border: 5px solid #191919;
            background-color: #fcfcfc;
            border-radius: 10px;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.6s ease 0s;
        }

        .aespa_e_value:focus {
            top: 0px;
        }

        .tri_e_last_win_part {
            display: none;
        }
    </style>
</head>

<body>
<div class="AespaEvent_full">
    <header class="tri_m_header">
        <Menu/>
        <section class="home_translate">
            <a href='/AespaEvent' class="on">한국어</a>
            <a href='/AespaEventEng'>English</a>
        </section>
    </header>
    <section class="tri_e_logo">
        <img src="./img/aespa_event_logo.png" alt="aespa 이벤트 로고">
    </section>
    <section class="tri_m_h2">
        <h2><img src="../../imgs/main_h2_deco.png" alt="aespa"/>앨범 제목 1글자씩 맞히기 이벤트<img src="../../imgs/main_h2_deco.png"
                                                                                       alt="aespa"/>
        </h2>
    </section>
    <section class='tri_m_intropp'>
        <p>
            2026년 5월 29일에<br/>
            발매된 &apos;aespa&apos;의<br/>
            앨범 제목을 1글자씩 맞혀 보세요!
        </p>
    </section>
    <section class="aespa_e_intropp2">
        <p></p>
    </section>
    <form class="aespa_e_form" action="">
        <input class="aespa_e_value" type="text" name="aespa_e_value1" autocomplete="off">
        <input class="aespa_e_value" type="text" name="aespa_e_value2" autocomplete="off" style="display: none">
        <input class="aespa_e_value" type="text" name="aespa_e_value3" autocomplete="off" style="display: none">
        <input class="aespa_e_value" type="text" name="aespa_e_value4" autocomplete="off" style="display: none">
        <input class="aespa_e_value" type="text" name="aespa_e_value5" autocomplete="off" style="display: none">
        <input class="aespa_e_value" type="text" name="aespa_e_value6" autocomplete="off" style="display: none">
        <input class="aespa_e_value" type="text" name="aespa_e_value7" autocomplete="off" style="display: none">
        <input class="aespa_e_value" type="text" name="aespa_e_value8" autocomplete="off" style="display: none">
    </form>
    <FooterPart100vh FooterPartText='ⓒ SM엔터테인먼트'/>
    <!--popup-->
    <section class="tri_e_last_win_part">
        <div class="tri_e_ghost_40px"></div>
        <section class="tri_m_h2">
            <h2>
                <img src="../../imgs/main_h2_deco.png" alt="aespa event">당첨입니다.<img src="../../imgs/main_h2_deco.png"
                                                                                    alt="aespa event">
            </h2>
        </section>
        <section class="tri_e_p_win_intropp">
            <p>
                당첨을 축하드려요!<br/>
                상품은 반지입니다.<br/>
                이벤트에 관심가져 주셔서 감사합니다.<br/>
                이 이벤트는 가상의 이벤트입니다.<br/>
                참고해 주시길 부탁드리겠습니다.<br/>
            </p>
        </section>
        <section class="tri_e_p_win_present_150">
            <img src={Aespa_e_present_ring} alt="반지" class="triples_e_p_win_present_img"/>
        </section>
    </section>
</div>
<script>
    const intro = document.querySelector(".aespa_e_intropp2 > p");
    const inputs = document.querySelectorAll(".aespa_e_value");
    const win = document.querySelector(".tri_e_last_win_part");
    const answer = "lemonade";

    intro.textContent = "현재: 1번째 글자";

    function check(e) {
        // 현재 입력이 일어난 input 요소와 그것의 인덱스(순서)를 찾습니다.
        const currentInput = e.target;
        const currentIndex = Array.from(inputs).indexOf(currentInput);

        // 현재 입력한 글자가 정답의 해당 자리 글자와 일치하는지 확인합니다.
        if (currentInput.value.toLowerCase() === answer[currentIndex]) {

            // 마지막 글자까지 모두 맞췄는지 확인합니다.
            if (currentIndex === answer.length - 1) {
                intro.textContent = "정답입니다!";
                win.style.display = "block";
            } else {
                // 다음 input 칸을 보여주고 포커스를 이동합니다.
                const nextInput = inputs[currentIndex + 1];
                nextInput.style.display = "block";
                nextInput.focus();

                intro.textContent = `현재: ${currentIndex + 2}번째 글자`;
            }
        } else {
            // 틀렸을 경우 기존 글자를 지우거나 안내할 수 있습니다. (선택사항)
            intro.textContent = `현재: ${currentIndex + 1}번째 글자 (틀렸습니다)`;
        }
    }

    // 각 input에 이벤트 리스너를 등록할 때 event 객체(e)를 전달합니다.
    inputs.forEach(input => {
        input.addEventListener("input", check);
    });
</script>

</body>

</html>
