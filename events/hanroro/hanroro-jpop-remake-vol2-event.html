<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>han</title>
    <link rel="stylesheet" href="../css/triples/TriplesEvent.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .win_popup {
            display: none;
        }

        .hanroro_event_button_train {
            width: 320px;
            height: 40px;
            position: relative;
        }

        .hanroro_event_button_train>input {
            width: 40px;
            height: 40px;
            position: absolute;
        }

        .hanroro_event_button_train>input:nth-child(1) {
            top: 0px;
            animation: hanroro_event_button_train_input1 2s ease 0s infinite;
        }

        @keyframes hanroro_event_button_train_input1 {
            0% {
                left: 0px;
            }

            50% {
                left: 80px;
            }

            100% {
                left: 0px;
            }
        }

        .hanroro_event_button_train>input:nth-child(2) {
            top: 0px;
            animation: hanroro_event_button_train_input2 2s ease 0s infinite;
        }

        @keyframes hanroro_event_button_train_input2 {
            0% {
                left: 40px;
            }

            50% {
                left: 160px;
            }

            100% {
                left: 40px;
            }
        }

        .hanroro_event_button_train>input:nth-child(3) {
            top: 0px;
            animation: hanroro_event_button_train_input3 2s ease 0s infinite;
        }

        @keyframes hanroro_event_button_train_input3 {
            0% {
                left: 80px;
            }

            50% {
                left: 280px;
            }

            100% {
                left: 80px;
            }
        }

        .hanroro_event_button_train>input:nth-child(4) {
            top: 0px;
            animation: hanroro_event_button_train_input4 2s ease 0s infinite;
        }

        @keyframes hanroro_event_button_train_input4 {
            0% {
                left: 120px;
            }

            50% {
                left: 240px;
            }

            100% {
                left: 120px;
            }
        }

        .hanroro_event_button_train>input:nth-child(5) {
            top: 0px;
            animation: hanroro_event_button_train_input5 2s ease 0s infinite;
        }

        @keyframes hanroro_event_button_train_input5 {
            0% {
                left: 160px;
            }

            50% {
                left: 0px;
            }

            100% {
                left: 160px;
            }
        }

        .hanroro_event_button_train>input:nth-child(6) {
            top: 0px;
            animation: hanroro_event_button_train_input6 2s ease 0s infinite;
        }

        @keyframes hanroro_event_button_train_input6 {
            0% {
                left: 200px;
            }

            50% {
                left: 120px;
            }

            100% {
                left: 200px;
            }
        }

        .hanroro_event_button_train>input:nth-child(7) {
            top: 0px;
            animation: hanroro_event_button_train_input7 2s ease 0s infinite;
        }

        @keyframes hanroro_event_button_train_input7 {
            0% {
                left: 240px;
            }

            50% {
                left: 200px;
            }

            100% {
                left: 240px;
            }
        }

        .hanroro_event_button_train>input:nth-child(7) {
            top: 0px;
            animation: hanroro_event_button_train_input7 2s ease 0s infinite;
        }

        @keyframes hanroro_event_button_train_input7 {
            0% {
                left: 240px;
            }

            50% {
                left: 200px;
            }

            100% {
                left: 240px;
            }
        }

        .hanroro_event_button_train>input:nth-child(8) {
            top: 0px;
            animation: hanroro_event_button_train_input8 2s ease 0s infinite;
        }

        @keyframes hanroro_event_button_train_input8 {
            0% {
                left: 270px;
            }

            50% {
                left: 40px;
            }

            100% {
                left: 270px;
            }
        }

        /*현재찬 칸 1  3 4 5 6 7 8*/
    </style>
</head>

<body>
    <section class="hanroro_event_button_train">
        <input type="button" value="1">
        <input type="button" value="2">
        <input type="button" value="3">
        <input type="button" value="4">
        <input type="button" value="5">
        <input type="button" value="6">
        <input type="button" value="7">
        <input type="button" value="8">
    </section>
    <div class="win_popup">당첨</div>
    <script>
        let last_str = "";
        const buttons_array = [
            document.querySelector("input[value=\"1\"]"),
            document.querySelector("input[value=\"2\"]"),
            document.querySelector("input[value=\"3\"]"),
            document.querySelector("input[value=\"4\"]"),
            document.querySelector("input[value=\"5\"]"),
            document.querySelector("input[value=\"6\"]"),
            document.querySelector("input[value=\"7\"]"),
            document.querySelector("input[value=\"8\"]")
        ];
        let win_popup = document.querySelector(".win_popup");

        const last_str_correct_check = () => {
            if (last_str === "12345678") {
                win_popup.style.display = "block";
                // console.log("당첨");
            }
        };

        buttons_array.forEach((butt) => {
            butt.addEventListener("click", () => {
                last_str += butt.value;
                butt.style.display = "none";
                console.log(last_str);
                last_str_correct_check();
            });
        });
    </script>
</body>

</html>
