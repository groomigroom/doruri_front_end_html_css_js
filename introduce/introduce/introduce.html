<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도루리 소개</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .logo_motion_structure {
            width: 185px;
            height: 100px;
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
        }

        .doruri_introduce_logo_do_deget_5_15 {
            position: absolute;
            left: 5px;
            animation: doruri_introduce_logo_do_deget_5_15 6s ease 0s infinite;
        }
        
        @keyframes doruri_introduce_logo_do_deget_5_15 {
            0% {
                top: -45px;
            }

            16% {
                top: 15px;
            }
        }

        .doruri_introduce_logo_do_oh_5_5bottom {
            position: absolute;
            bottom: 5px;
        }
        
        @keyframes doruri_introduce_logo_do_oh_5_5bottom {
            0% {
                left: -45px;
            }
            16% {
                left: -45px;
            }
        }
    </style>
</head>
<body>
<div class="logo_motion_structure">
    <img src="./img/doruri_introduce_logo_do_deget_5_15.png" alt="doruri_도_ㄷ" class="doruri_introduce_logo_do_deget_5_15">
    <img src="./img/doruri_introduce_logo_do_oh_5_5bottom.png" alt="doruri_도_ㅗ" class="doruri_introduce_logo_do_oh_5_5bottom">
    <img src="./img/doruri_introduce_logo_structure.png" alt="도루리 로고 틀">
</div>
</body>
</html>
