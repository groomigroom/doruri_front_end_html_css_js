    <style>
        .idolList_full {
            width: 100vw;
            height: 200vh;
            position: relative;
        }

        .idolList_part {
            width: 100vw;
            height: calc(100vh - 50px);
            background-color: #e6e6e6;
            position: absolute;
            top: 50px;
            left: 0px;
        }

        .idolList_trainf {
            width: 920px;
            height: 680px;
            display: block;
            background-color: bisque;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .idolList_train {
            width: 920px;
            height: 200px;
            display: flex;
            justify-content: space-between;
            position: absolute;
        }

        .idolList_train:first-child {
            top: 0px;
            left: 0px;
        }

        .idolList_train:nth-child(2) {
            top: 240px;
            left: 0px;
        }

        .idolList_train:last-child {
            bottom: 0px;
            left: 0px;
        }

        .idolList_link {
            display: block;
            width: 200px;
            height: 200px;
            position: relative;
            border: 1px solid red;
        }

        .idolList_link_a {
            width: 160px;
            height: 160px;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .idolList_link_a>img {
            width: 160px;
            border-radius: 25px;
            position: absolute;
            top: 0px;
            left: 0px;
            opacity: 1;
            transform: rotateY(0deg);
            transition: all 0.6s ease 0s;
        }

        .idolList_link_a>div {
            width: 160px;
            height: 160px;
            border-radius: 25px;
            position: absolute;
            top: 0px;
            left: 0px;
            opacity: 0;
            transform: rotateY(-180deg);
            transition: all 0.6s ease 0s;
        }

        .idolList_link_a>div>h4 {
            font-weight: 700;
            font-size: 19px;
            line-height: 140%;
            display: block;
            width: 150px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .idolList_link_a:hover>img {
            opacity: 0;
            transform: rotateY(-180deg);
        }

        .idolList_link_a:hover>div {
            opacity: 1;
            transform: rotateY(0deg);
        }

        .idolList_link_tri>img {
            border: 5px solid #191919;
        }

        .idolList_link_tri>div {
            border: 5px solid #191919;
        }

        .idolList_link_txt>img {
            border: 5px solid #FF1E91;
        }

        .idolList_link_txt>div {
            border: 5px solid #FF1E91;
        }

        .idolList_link_akmu>img {
            border: 5px solid #13983f;
        }

        .idolList_link_akmu>div {
            border: 5px solid #13983f;
        }

        .idolList_link_ioi>img {
            border: 5px solid #F4CE9D;
        }

        .idolList_link_ioi>div {
            border: 5px solid #F4CE9D;
        }

        .idolList_link_str>img {
            border: 5px solid #191919;
        }

        .idolList_link_str>div {
            border: 5px solid #191919;
        }

        .idolList_link_ten>img {
            border: 5px solid #000000;
        }

        .idolList_link_ten>div {
            border: 5px solid #000000;
        }

        .idolList_12345 {
            position: absolute;
            bottom: 400px;
        }

        .idolList_trainf_mobile {
            display: none;
        }

        }
    </style>
